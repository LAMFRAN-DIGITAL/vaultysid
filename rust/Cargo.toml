[package]
name = "vaultysid"
version = "0.1.0"
authors = ["Vaultys"]
edition = "2021"
rust-version = "1.94"
description = "Cryptographic identity library providing Ed25519 signing, X25519 key exchange, and DID-based identity management"
documentation = "https://docs.rs/vaultysid"
readme = "README.md"
homepage = "https://github.com/vaultys/vaultysid"
repository = "https://github.com/vaultys/vaultysid"
license = "MIT"
keywords = ["cryptography", "identity", "ed25519", "x25519", "did"]
categories = ["cryptography", "authentication", "encoding"]
exclude = [
    "target/*",
    ".github/*",
    "*.sh",
]


[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
crate-type = ["cdylib", "rlib"]

[badges]
maintenance = { status = "actively-developed" }

[dependencies]
# Async support
async-trait = "0.1.92"

# Cryptographic primitives
ed25519-dalek = "3.0"
x25519-dalek = { version = "3.0", features = ["static_secrets"] }
curve25519-dalek = "5.0"
sha2 = "0.11"
hmac = "0.13"
chacha20poly1305 = "0.11"
hkdf = "0.13"
rand = "0.10"

# Post-quantum cryptography
# X-Wing KEM (draft-connolly-cfrg-xwing-kem); hazmat for deterministic encapsulation in test vectors
x-wing = { version = "0.1.1", features = ["hazmat", "zeroize"] }
kem = "0.3"
libcrux-ml-dsa = "0.0.12"
# Post-quantum identities and DHIES v3 (rfc/PQ-ENCRYPTION.md): ML-KEM-768 (FIPS 203)
# and the NaCl secretbox (XSalsa20-Poly1305) used by DHIES. `hazmat` exposes
# encapsulate_deterministic(m), called with fresh random m (and fixed m in tests).
# libcrux-ml-dsa >= 0.0.9 no longer pins hax-lib: libcrux-ml-kem 0.0.11 resolves alongside it (checked),
# so it could replace ml-kem (RustCrypto) later; ml-kem is kept here to keep this change small.
ml-kem = { version = "0.3.4", default-features = false, features = ["hazmat", "zeroize"] }
crypto_secretbox = { version = "0.1.1", default-features = false, features = ["alloc", "salsa20"] }

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11"
rmp-serde = "1.1"  # MessagePack
base64 = "0.23"
hex = "0.4"

# JSON support
serde_json = "1.0"

# Error handling
thiserror = "2.0"

# Memory safety
zeroize = { version = "1.9", features = ["derive"] }

# Async runtime
tokio = { version = "1.54", features = ["full"] }
zerocopy = "0.8.63"

[dev-dependencies]
anyhow = "1.0.104"  # examples/basic_usage.rs
tempfile = "3.27"
criterion = "0.8"
proptest = "1.12"
tokio = { version = "1.54", features = ["full", "test-util"] }

[features]
default = []

[[bench]]
name = "crypto_bench"
harness = false

[[bin]]
name = "cross_language_test"
path = "src/bin/cross_language_test.rs"
required-features = []

[[bin]]
name = "debug_channel"
path = "src/bin/debug_channel.rs"
required-features = []

[[example]]
name = "basic_usage"

[[example]]
name = "dhies_example"

[[example]]
name = "dilithium_example"

[[example]]
name = "vaultysid_dilithium_example"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.wasm]
inherits = "release"
opt-level = "s"
lto = true

[profile.bench]
inherits = "release"
